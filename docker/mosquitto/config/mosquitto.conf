# ============================================
# Mosquitto – Configuração de Desenvolvimento
# Projeto: ac-iot-ufma
# ============================================

# Listener MQTT padrão (TCP)
listener 1883

# Listener WebSocket (para Node-RED Dashboard)
listener 9001
protocol websockets

# Permitir conexões anônimas (SOMENTE em desenvolvimento)
allow_anonymous true

# Persistência de mensagens
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest stdout
log_type all
connection_messages true
