version: '3'

services:
  # Node-RED automation and dashboard.
  nodered:
    image: nodered/node-red:latest
    container_name: ac_iot_nodered
    ports:
      - "1880:1880"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./docker/nodered/data:/data
    restart: unless-stopped

  # Automatic ESP32 room simulator communicating directly with UFMA InterSCity
  simulador:
    build:
      context: ./simulador
    container_name: ac_iot_simulador
    environment:
      - POLL_INTERVAL=3
      - PUBLISH_INTERVAL=10
      - TOTAL_SALAS=1
      - INTERSCITY_URL=https://cidadesinteligentes.lsdi.ufma.br/interscity_lh
    restart: unless-stopped
